port: 8000
max-model-len: 128000
uvicorn-log-level: "debug" 
gpu-memory-utilization: 0.85
dtype: auto
trust-remote-code: true
served_model_name: "Qwen3.6-35B-A3B-NVFP4"
max-num-seqs: 16
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
enable-prefix-caching: true
max_num_batched_tokens: 4096
async-scheduling: true
stream-interval: 3
enable-chunked-prefill: true
speculative-config: '{"method": "dflash", "model": "modal-labs/Qwen3.6-35B-A3B-DFlash", "num_speculative_tokens": 15}'
# speculative-config: '{"method":"mtp","num_speculative_tokens":3}' 
default-chat-template-kwargs: '{"enable_thinking": true}'
override-generation-config: '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "presence_penalty": 1.3, "repetition_penalty": 1.0}'
mm_processor_cache_gb: 1
limit-mm-per-prompt: '{"image": 1}' # changeable
mm-encoder-tp-mode: data
mm-processor-cache-type: shm
quantization: modelopt
